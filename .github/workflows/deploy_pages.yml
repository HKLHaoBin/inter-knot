name: Deploy Pages on tag

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart run gen_secrets.dart
        env:
          CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID_BASE64 }}
      - run: flutter pub get
      - run: flutter build web --pwa-strategy=none
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: build/web
